name: Build Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-package:
    name: Create Deployment Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          zip -r journal.zip . -x ".git/*" -x ".github/*" -x "*.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: journal-package
          path: journal.zip
          retention-days: 30